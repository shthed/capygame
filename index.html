<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="assets/capybara.webp" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CapyGame 3D" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Capy - Color by Number & CapyGame 3D</title>
    <meta name="description" content="Hardware-accelerated 3D multi-scale universe simulator, contiguous Capybara world builder, and multiphysics mini-game archipelago." />
    <meta property="og:title" content="Capy - Color by Number & CapyGame 3D" />
    <meta property="og:description" content="Hardware-accelerated 3D multi-scale universe simulator, contiguous Capybara world builder, and multiphysics mini-game archipelago." />
  </head>
  <body class="bg-black text-slate-100 overflow-hidden select-none">
    <div id="root"></div>
    <script>
      (function () {
        function renderBootError(title, detail) {
          if (window.__capyBooted) return;
          var root = document.getElementById('root');
          if (!root) return;
          while (root.firstChild) {
            root.removeChild(root.firstChild);
          }

          var overlay = document.createElement('div');
          overlay.setAttribute('data-testid', 'boot-error-fallback');
          overlay.setAttribute('role', 'alert');
          overlay.style.cssText =
            'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#020617;color:#f8fafc;padding:16px;font-family:system-ui,-apple-system,sans-serif;z-index:9999;';

          var card = document.createElement('div');
          card.style.cssText =
            'max-width:420px;width:100%;background:#0f172a;border:1px solid rgba(244,63,94,0.4);border-radius:20px;padding:24px;box-shadow:0 20px 40px rgba(0,0,0,0.6);';

          var kicker = document.createElement('div');
          kicker.style.cssText =
            'font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;color:#fb7185;margin-bottom:4px;';
          kicker.textContent = 'Startup Diagnostic';

          var heading = document.createElement('h1');
          heading.style.cssText = 'font-size:18px;font-weight:900;margin:0 0 10px 0;color:#ffffff;';
          heading.textContent = String(title || 'Application Failed to Start');

          var body = document.createElement('p');
          body.style.cssText = 'font-size:13px;line-height:1.5;color:#cbd5e1;margin:0 0 14px 0;';
          body.textContent =
            'CapyGame encountered an error while loading application scripts on your device. Try reloading or clearing cached offline data.';

          var pre = document.createElement('pre');
          pre.style.cssText =
            'font-size:11px;background:#020617;border:1px solid #1e293b;border-radius:10px;padding:10px;color:#fda4af;white-space:pre-wrap;word-break:break-word;max-height:110px;overflow:auto;margin:0 0 16px 0;';
          pre.textContent = String(detail || 'Unknown startup error');

          var actions = document.createElement('div');
          actions.style.cssText = 'display:flex;flex-direction:column;gap:8px;';

          var reloadBtn = document.createElement('button');
          reloadBtn.type = 'button';
          reloadBtn.style.cssText =
            'padding:11px 16px;border-radius:12px;border:none;background:#10b981;color:#020617;font-weight:800;font-size:13px;cursor:pointer;';
          reloadBtn.textContent = 'Reload Application';
          reloadBtn.addEventListener('click', function () {
            window.location.reload();
          });

          actions.appendChild(reloadBtn);
          card.appendChild(kicker);
          card.appendChild(heading);
          card.appendChild(body);
          card.appendChild(pre);
          card.appendChild(actions);
          overlay.appendChild(card);
          root.appendChild(overlay);
        }
        function shouldAutoRetryBoot(msg) {
          if (!msg) return false;
          var lower = String(msg).toLowerCase();
          if (
            lower.indexOf('dynamically imported module') !== -1 ||
            lower.indexOf('module script failed') !== -1 ||
            lower.indexOf('outdated optimize dep') !== -1 ||
            lower.indexOf('failed to fetch') !== -1
          ) {
            try {
              if (!sessionStorage.getItem('__capy_cold_boot_retry')) {
                sessionStorage.setItem('__capy_cold_boot_retry', '1');
                setTimeout(function () {
                  window.location.reload();
                }, 400);
                return true;
              }
            } catch (err) {}
          }
          return false;
        }
        window.addEventListener('error', function (e) {
          if (!window.__capyBooted && e && e.message) {
            if (shouldAutoRetryBoot(e.message)) return;
            renderBootError('Application Failed to Start', e.message);
          }
        });
        window.addEventListener('unhandledrejection', function (e) {
          if (!window.__capyBooted && e && e.reason) {
            var msg = e.reason.message || String(e.reason);
            if (shouldAutoRetryBoot(msg)) return;
            renderBootError('Startup Promise Rejected', msg);
          }
        });
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
