name: Cleanup closed PR previews

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read
  pull-requests: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  delete-merged-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Delete branch from origin
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          BRANCH_NAME="${HEAD_REF}"

          if [ -z "${BRANCH_NAME}" ]; then
            echo "No branch provided; skipping delete."
            exit 0
          fi

          if [ "${BRANCH_NAME}" = "${DEFAULT_BRANCH}" ] || [ "${BRANCH_NAME}" = "beta" ] || [ "${BRANCH_NAME}" = "gh-pages" ]; then
            echo "Skipping deletion of protected branch ${BRANCH_NAME}."
            exit 0
          fi

          git push origin --delete "${BRANCH_NAME}" || echo "Branch deletion skipped (already removed or protected)."

  cleanup:
    if: false # shthed/capygame enforces main-only github-pages (no pull/<N>/ previews deployed)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Check gh-pages branch existence
        id: check_pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --exit-code --heads "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No gh-pages branch found; skipping Pages preview cleanup."
          fi

      - name: Checkout gh-pages branch
        if: steps.check_pages.outputs.exists == 'true'
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Use Node.js 22
        if: steps.check_pages.outputs.exists == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run gh-pages preview cleanup
        if: steps.check_pages.outputs.exists == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          node ./.github/scripts/cleanup-gh-pages-previews.mjs \
            --pages-dir ./gh-pages \
            --target-pr "${TARGET_PR}" \
            --ignore-recency

      - name: Commit and push gh-pages updates (squashed history)
        if: steps.check_pages.outputs.exists == 'true'
        id: sync_pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          cd gh-pages

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git add -A
          if git diff --cached --quiet && ! git rev-parse --verify -q HEAD^ >/dev/null; then
            echo "No gh-pages changes to push."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout --orphan gh-pages-squashed
          git add -A
          git commit -m "Cleanup preview for PR #${PR_NUMBER}"
          git branch -M gh-pages
          git push --force origin gh-pages
          cd ..
          rm -rf gh-pages/.git
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        if: steps.check_pages.outputs.exists == 'true' && steps.sync_pages.outputs.has_changes == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: gh-pages
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        if: steps.check_pages.outputs.exists == 'true' && steps.sync_pages.outputs.has_changes == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
